name: build

# 每个国内平台单独打 zip。脚本放进 scripts/，说明文件留在包根目录。CI 各上传一个 artifact，打 tag 时发布四个 zip。不含根 doc。

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q netease qq kugou qishui spotify youtube tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check standalone Qishui login
        run: |
          node --check qishui/login.cjs
          node qishui/login.cjs --self-test

  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [netease, qq, kugou, qishui]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack platform
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          stage="$(mktemp -d)"
          mkdir -p "$stage/scripts" dist
          git archive --format=tar "HEAD:${platform}" | tar -x -C "$stage/scripts"
          find "$stage/scripts" -maxdepth 1 -type f ! -name '*.py' ! -name '*.cjs' -exec mv {} "$stage/" \;
          archive="$PWD/dist/${platform}-${version}.zip"
          (cd "$stage" && zip -qr "$archive" .)
          rm -rf "$stage"
          unzip -Z1 "$archive" > "dist/${platform}.txt"
          awk -F/ '
            {
              for (i = 1; i <= NF; i++) {
                if ($i == "cookie" || $i == "token" || $i == "credentials" || $i == "credentials.json" || $i == "cookies.txt" || $i == "tests" || $i == "doc" || $i == "spotify" || $i == "youtube" || $i == "__pycache__" || $i == ".venv") {
                  print "forbidden path: " $0 > "/dev/stderr"
                  exit 1
                }
              }
              if ($1 != "scripts" && $1 != "SKILL.md" && $1 != "README.md" && $1 != "requirements.txt" && $1 != "requirements-terminal.txt" && $1 != "THIRD_PARTY_NOTICES.md" && $1 != "LICENSE.ly-music-source") exit 1
            }
          ' "dist/${platform}.txt"
          grep -Fxq "scripts/playurl.py" "dist/${platform}.txt"
          grep -Fxq "scripts/search.py" "dist/${platform}.txt"
          grep -Fxq "SKILL.md" "dist/${platform}.txt"
          grep -Fxq "README.md" "dist/${platform}.txt"
          unzip -Z1 "$archive"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.platform }}-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download netease
        uses: actions/download-artifact@v4
        with:
          name: netease
          path: dist
      - name: Download qq
        uses: actions/download-artifact@v4
        with:
          name: qq
          path: dist
      - name: Download kugou
        uses: actions/download-artifact@v4
        with:
          name: kugou
          path: dist
      - name: Download qishui
        uses: actions/download-artifact@v4
        with:
          name: qishui
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0
        run: |
          set -euo pipefail
          ls -R dist
          test "$(find dist -name '*.zip' | wc -l)" -eq 4
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
