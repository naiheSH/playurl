name: build

# 每个国内平台单独打 zip。CI 各上传一个 artifact，打 tag 时发布四个 zip。不含根 doc。

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q netease qq kugou qishui spotify youtube tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check standalone Qishui login
        run: |
          node --check qishui/login.cjs
          node qishui/login.cjs --self-test

  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [netease, qq, kugou, qishui]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack platform
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          archive="dist/${platform}-${version}.zip"
          git archive --format=zip --prefix="${platform}/" -o "$archive" "HEAD:${platform}"
          unzip -Z1 "$archive" > "dist/${platform}.txt"
          awk -F/ -v platform="$platform" '
            {
              for (i = 1; i <= NF; i++) {
                if ($i == "cookie" || $i == "token" || $i == "credentials" || $i == "credentials.json" || $i == "cookies.txt" || $i == "tests" || $i == "doc" || $i == "spotify" || $i == "youtube" || $i == "__pycache__" || $i == ".venv") {
                  print "forbidden path: " $0 > "/dev/stderr"
                  exit 1
                }
              }
              if ($1 != platform && $1 != platform "/") exit 1
            }
          ' "dist/${platform}.txt"
          grep -Fxq "${platform}/playurl.py" "dist/${platform}.txt"
          grep -Fxq "${platform}/README.md" "dist/${platform}.txt"
          unzip -Z1 "$archive"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.platform }}-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: netease|qq|kugou|qishui
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find dist -name '*.zip' | wc -l)" -eq 4
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
