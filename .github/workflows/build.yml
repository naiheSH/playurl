name: build-skill-studio

# skill-studio 分支只构建四个国内平台的 Skill Studio 包，并上传到 main 的同版本 Release。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v, for example 2.0.0"
        required: true
        type: string
  push:
    branches: [skill-studio]
    tags: ["skill-studio-v*"]

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run unit tests
        run: |
          python -B -m unittest discover -s tests -v
          python -B -m unittest discover -s skillstudio/tests -v
          python -B -m unittest discover -s skillstudio/kugou/tests -v

      - name: Compile Python sources
        run: python -m compileall -q netease qq kugou qishui skillstudio tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check standalone Qishui login
        run: |
          node --check qishui/login.cjs
          node qishui/login.cjs --self-test

  package-skill-studio:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [netease, qq, kugou, qishui]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pack Skill Studio platform
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          if [[ "${GITHUB_REF}" == refs/tags/skill-studio-v* ]]; then
            version="${GITHUB_REF_NAME#skill-studio-v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            version="${version#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?|[0-9a-f]{7})$ ]]; then
            echo "invalid release version: $version" >&2
            exit 2
          fi
          python skillstudio/build_platforms.py "$platform" --version "$version" --output-dir dist
          archive="$PWD/dist/skill-studio-${platform}-${version}.zip"
          test -f "$archive"
          unzip -tqq "$archive"
          unzip -Z1 "$archive" > "dist/${platform}.txt"
          grep -Fxq "scripts/runtime.py" "dist/${platform}.txt"
          grep -Fxq "scripts/playurl.py" "dist/${platform}.txt"
          grep -Fxq ".skill-studio/contract.json" "dist/${platform}.txt"
          grep -Fxq "implementation.json" "dist/${platform}.txt"
          if awk -F/ '{print $NF}' "dist/${platform}.txt" | grep -Eq '^(login\.py|auth\.py|device\.py|cookie|token|credentials|credentials\.json|cookies\.txt|request\.json)$'; then
            echo "forbidden credential or login file in $archive" >&2
            exit 1
          fi
          unzip -Z1 "$archive"

      - name: Upload Skill Studio package
        uses: actions/upload-artifact@v4
        with:
          name: skill-studio-${{ matrix.platform }}
          path: dist/skill-studio-${{ matrix.platform }}-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/skill-studio-v') || github.event_name == 'workflow_dispatch'
    needs: package-skill-studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Skill Studio netease
        uses: actions/download-artifact@v4
        with:
          name: skill-studio-netease
          path: dist
      - name: Download Skill Studio qq
        uses: actions/download-artifact@v4
        with:
          name: skill-studio-qq
          path: dist
      - name: Download Skill Studio kugou
        uses: actions/download-artifact@v4
        with:
          name: skill-studio-kugou
          path: dist
      - name: Download Skill Studio qishui
        uses: actions/download-artifact@v4
        with:
          name: skill-studio-qishui
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -R dist
          if [[ "${GITHUB_REF}" == refs/tags/skill-studio-v* ]]; then
            version="${GITHUB_REF_NAME#skill-studio-v}"
          else
            version="${{ inputs.version }}"
            version="${version#v}"
          fi
          release_tag="v${version}"
          notes_file="doc/RELEASE_NOTES_${release_tag}.md"
          test "$(find dist -name "skill-studio-*-${version}.zip" | wc -l)" -eq 4
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" dist/*.zip --clobber
            if [[ -f "$notes_file" ]]; then
              gh release edit "$release_tag" --title "playurl $release_tag" --notes-file "$notes_file"
            fi
          else
            if [[ -f "$notes_file" ]]; then
              gh release create "$release_tag" dist/*.zip \
                --target main \
                --title "playurl $release_tag" \
                --notes-file "$notes_file"
            else
              gh release create "$release_tag" dist/*.zip \
                --target main \
                --title "playurl $release_tag" \
                --generate-notes
            fi
          fi
