name: build-skill-studio

# skill-studio 分支只构建四个国内平台的 Skill Studio 包，并上传到 main 共用的 v2.0.0 Release。

on:
  workflow_dispatch:
  push:
    branches: [skill-studio]
    tags: ["v*-skill-studio"]

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run unit tests
        run: |
          python -B -m unittest discover -s tests -v
          python -B -m unittest discover -s skillstudio/tests -v
          python -B -m unittest discover -s skillstudio/kugou/tests -v

      - name: Compile Python sources
        run: python -m compileall -q netease qq kugou qishui skillstudio tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check standalone Qishui login
        run: |
          node --check qishui/login.cjs
          node qishui/login.cjs --self-test

  package-skill-studio:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [netease, qq, kugou, qishui]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pack Skill Studio platform
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          python skillstudio/build_platforms.py "$platform" --version 2.0.0 --output-dir dist
          archive="$PWD/dist/playurl-${platform}-skill-studio-2.0.0.zip"
          test -f "$archive"
          unzip -tqq "$archive"
          unzip -Z1 "$archive" > "dist/${platform}.txt"
          grep -Fxq "scripts/runtime.py" "dist/${platform}.txt"
          grep -Fxq "scripts/playurl.py" "dist/${platform}.txt"
          grep -Fxq ".skill-studio/contract.json" "dist/${platform}.txt"
          grep -Fxq "implementation.json" "dist/${platform}.txt"
          if awk -F/ '{print $NF}' "dist/${platform}.txt" | grep -Eq '^(login\.py|auth\.py|device\.py|cookie|token|credentials|credentials\.json|cookies\.txt|request\.json)$'; then
            echo "forbidden credential or login file in $archive" >&2
            exit 1
          fi
          unzip -Z1 "$archive"

      - name: Upload Skill Studio package
        uses: actions/upload-artifact@v4
        with:
          name: skill-studio-${{ matrix.platform }}
          path: dist/playurl-${{ matrix.platform }}-skill-studio-2.0.0.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-skill-studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Skill Studio netease
        uses: actions/download-artifact@v4
        with:
          name: skill-studio-netease
          path: dist
      - name: Download Skill Studio qq
        uses: actions/download-artifact@v4
        with:
          name: skill-studio-qq
          path: dist
      - name: Download Skill Studio kugou
        uses: actions/download-artifact@v4
        with:
          name: skill-studio-kugou
          path: dist
      - name: Download Skill Studio qishui
        uses: actions/download-artifact@v4
        with:
          name: skill-studio-qishui
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v2.0.0
        run: |
          set -euo pipefail
          ls -R dist
          test "$(find dist -name 'playurl-*-skill-studio-2.0.0.zip' | wc -l)" -eq 4
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file doc/RELEASE_NOTES_v2.0.0.md
          else
            gh release create "$RELEASE_TAG" dist/*.zip \
              --target main \
              --title "$RELEASE_TAG" \
              --notes-file doc/RELEASE_NOTES_v2.0.0.md
          fi
